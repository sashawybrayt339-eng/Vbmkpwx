<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحه اصلی</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top, 0px); }

  .menu-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 20;
    width: 44px; height: 44px; background: transparent; border: none; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 0;
  }
  .menu-btn span {
    display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
  }
  .menu-btn.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

  .dropdown {
    position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 10;
    background: #111; border: 1px solid #333; border-radius: 10px; min-width: 200px;
    padding: 8px 0; list-style: none; margin: 0;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  .dropdown.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .dropdown a {
    display: block; padding: 12px 20px; color: #fff; text-decoration: none; font-size: 16px;
  }
  .dropdown a:active, .dropdown a:hover { background: #222; }

  main { height: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="منو" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<ul class="dropdown" id="dropdown">
  <li><a href="#">خانه</a></li>
  <li><a href="#">درباره ما</a></li>
  <li><a href="#">تماس با ما</a></li>
</ul>

<main></main>

<script>
  const btn = document.getElementById('menuBtn');
  const menu = document.getElementById('dropdown');

  function setOpen(open) {
    btn.classList.toggle('open', open);
    menu.classList.toggle('show', open);
    btn.setAttribute('aria-expanded', open);
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(!menu.classList.contains('show'));
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target)) setOpen(false);
  });
</script>
</body>
</html>
